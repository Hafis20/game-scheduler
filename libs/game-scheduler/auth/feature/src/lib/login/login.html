<div class="flex min-h-svh items-center justify-center bg-white px-5 py-24">
  <main class="w-full max-w-sm text-center">
    <img
      src="/game-scheduler-logo.webp"
      alt="Game Scheduler"
      class="mx-auto h-14 w-auto object-contain"
    />

    <h1 class="mt-8 text-2xl font-bold text-gray-950">Welcome back</h1>
    <p class="mt-2 text-sm leading-6 text-gray-500">
      Sign in to create and manage your tournaments.
    </p>

    <button
      type="button"
      class="mt-8 flex min-h-12 w-full cursor-pointer items-center justify-center gap-3 rounded-xl border border-gray-300 bg-white px-4 text-sm font-semibold text-gray-800 transition hover:border-gray-400 hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600"
      (click)="signIn()"
    >
      <svg class="size-5" viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="#4285F4"
          d="M21.35 12.23c0-.79-.07-1.55-.2-2.28H12v4.31h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.92-4.18 2.92-7.42z"
        />
        <path
          fill="#34A853"
          d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.53A9.74 9.74 0 0 0 12 21.5z"
        />
        <path
          fill="#FBBC05"
          d="M6.54 13.59a5.85 5.85 0 0 1 0-3.18V7.88H3.29a9.5 9.5 0 0 0 0 8.24l3.25-2.53z"
        />
        <path
          fill="#EA4335"
          d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.49 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.71 5.38l3.25 2.53C7.31 8.1 9.46 6.38 12 6.38z"
        />
      </svg>

      Continue with Google
    </button>

    <p class="mt-5 text-xs leading-5 text-gray-400">
      By continuing, you agree to our
      <a href="#" class="text-gray-600 hover:underline">Terms</a>
      and
      <a href="#" class="text-gray-600 hover:underline">Privacy Policy</a>.
    </p>
  </main>
</div>
