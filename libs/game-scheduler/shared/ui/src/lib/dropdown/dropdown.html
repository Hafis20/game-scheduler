<div class="flex flex-col gap-2">
  @if (label()) {
  <label [for]="id()" class="text-sm font-medium">{{ label() }}</label>
  }

  <div class="relative">
    <button
      [id]="id()"
      type="button"
      role="combobox"
      aria-haspopup="listbox"
      [attr.aria-controls]="listboxId()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-required]="required()"
      [attr.aria-invalid]="invalid()"
      [disabled]="disabled()"
      (click)="toggleDropdown()"
      (keydown)="onTriggerKeydown($event)"
      (blur)="touch.emit()"
      class="flex w-full cursor-pointer items-center justify-between gap-3 rounded-md border border-slate-300 bg-white px-3 py-2.5 text-left text-sm outline-none transition focus:border-gray-900 disabled:cursor-not-allowed disabled:opacity-50"
      [class.border-red-500]="invalid()"
    >
      <span [class.text-gray-400]="!selectedOption()">
        {{ selectedOption()?.label ?? placeholder() }}
      </span>
      <span
        aria-hidden="true"
        class="text-xs text-gray-500 transition-transform"
        [class.rotate-180]="isOpen()"
      >
        ▼
      </span>
    </button>

    @if (isOpen()) {
    <div
      [id]="listboxId()"
      role="listbox"
      class="absolute inset-x-0 top-full z-[9999] mt-1 max-h-60 overflow-y-auto rounded-md border border-gray-200 bg-white py-1 shadow-xl"
    >
      @for (option of options(); track option.value) {
      <button
        type="button"
        role="option"
        [attr.aria-selected]="option.value === value()"
        [disabled]="option.disabled ?? false"
        [class]="optionClasses(option)"
        (click)="selectOption(option)"
      >
        <span>{{ option.label }}</span>
        @if (option.value === value()) {
        <span aria-hidden="true" class="font-black text-[#2f7d32]">✓</span>
        }
      </button>
      } @empty {
      <p class="px-3 py-2.5 text-sm text-gray-500">No options available</p>
      }
    </div>
    }
  </div>
</div>
