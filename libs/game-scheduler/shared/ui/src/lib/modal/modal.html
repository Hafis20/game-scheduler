@if (open()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <button
    type="button"
    class="absolute inset-0 bg-black/50"
    aria-label="Close modal"
    (click)="onBackdropClick()"
  ></button>

  <!-- Modal -->
  <div
    class="relative z-10 max-h-[90vh] rounded-xl bg-white px-4 shadow-xl"
    [class]="sizeClasses()"
    [class.overflow-visible]="allowContentOverflow()"
    [class.overflow-auto]="!allowContentOverflow()"
    role="dialog"
    aria-modal="true"
  >
    <!-- Header -->
    <div
      class="shrink-0 border-b border-gray-200 px-0.5 font-semibold text-xl pt-4 pb-1.5"
    >
      <ng-content select="[modal-header]" />
    </div>

    <!-- Content -->
    <div
      class="flex-1 px-1 py-4"
      [class.overflow-visible]="allowContentOverflow()"
      [class.overflow-y-auto]="!allowContentOverflow()"
    >
      <ng-content select="[modal-content]" />
    </div>

    <!-- Footer -->
    <div class="shrink-0 border-t border-gray-200 px-0.5 py-4 flex justify-end">
      <ng-content select="[modal-footer]" />
    </div>
  </div>
</div>
}
