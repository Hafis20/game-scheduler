<header
  class="fixed inset-x-0 top-0 z-50 border-b py-2 border-gray-200 bg-white/90 backdrop-blur-md transition-shadow duration-200"
  [class.shadow-sm]="isScrolled()"
>
  <div
    class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-4 sm:px-6 lg:px-8"
  >
    <a
      class="flex min-w-0 items-center text-gray-950"
      routerLink="/"
      fragment="top"
      aria-label="Game Scheduler home"
    >
      <img
        src="/game-scheduler-logo.webp"
        alt="Game Scheduler"
        class="w-auto h-12 md:h-16 shrink-0 object-contain"
      />
    </a>

    <nav
      aria-label="Primary navigation"
      class="hidden items-center gap-6 lg:flex"
    >
      <a
        class="text-sm font-semibold text-gray-600 transition hover:text-black"
        routerLink="/"
        fragment="arena"
        >Tournaments</a
      >
      <a
        class="text-sm font-semibold text-gray-600 transition hover:text-black"
        routerLink="/"
        fragment="teams"
        >Games</a
      >
      <a
        class="text-sm font-semibold text-gray-600 transition hover:text-black"
        routerLink="/"
        fragment="format"
        >Flow</a
      >
      <a
        class="text-sm font-semibold text-gray-600 transition hover:text-black"
        routerLink="/"
        fragment="knockout"
        >Queue</a
      >
      <a
        class="text-sm font-semibold text-gray-600 transition hover:text-black"
        routerLink="/"
        fragment="rules"
        >Rules</a
      >
    </nav>

    <div class="flex shrink-0 items-center gap-2 sm:gap-3">
      <game-scheduler-button
        label="Schedule"
        icon="calendar"
        routerLink="/matches"
        variant="ghost"
      />
      @if (authLoading()) {
        <div class="h-10 w-24 animate-pulse rounded bg-gray-200"></div>
      } @else if (user(); as currentUser) {
        <div class="relative flex items-center">
          @if (avatarUrl(currentUser); as avatar) {
            <button
              type="button"
              class="rounded-full outline-none transition focus-visible:ring-2 focus-visible:ring-green-500 focus-visible:ring-offset-2"
              aria-label="Open account menu"
              aria-haspopup="menu"
              [attr.aria-expanded]="showProfileMenu()"
              (click)="toggleProfileMenu()"
            >
              <img
                class="size-10 cursor-pointer rounded-full border border-gray-200 object-cover transition hover:border-gray-400"
                [src]="avatar"
                [alt]="currentUser.email || 'User avatar'"
              />
            </button>
          } @else {
            <button
              type="button"
              class="inline-flex size-10 cursor-pointer items-center justify-center rounded-full bg-gray-950 text-sm font-bold text-white outline-none transition hover:bg-gray-800 focus-visible:ring-2 focus-visible:ring-green-500 focus-visible:ring-offset-2"
              aria-label="Open account menu"
              aria-haspopup="menu"
              [attr.aria-expanded]="showProfileMenu()"
              (click)="toggleProfileMenu()"
            >
              {{ currentUser.email?.charAt(0)?.toUpperCase() || 'U' }}
            </button>
          }

          @if (showProfileMenu()) {
            <div
              role="menu"
              class="absolute right-0 top-12 z-60 w-72 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-xl"
            >
              <div class="border-b border-gray-100 px-4 py-3.5">
                <p class="truncate text-sm font-semibold text-gray-950">
                  {{ displayName(currentUser) }}
                </p>
                <p class="mt-0.5 truncate text-xs text-gray-500">
                  {{ currentUser.email }}
                </p>
              </div>

              <div class="p-2">
                <button
                  type="button"
                  role="menuitem"
                  class="group flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left transition hover:bg-gray-50 focus-visible:bg-gray-50 focus-visible:outline-none"
                  (click)="navigateToDashboard()"
                >
                  <span
                    class="inline-flex size-9 shrink-0 items-center justify-center rounded-lg bg-green-50 text-green-700"
                    aria-hidden="true"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      class="size-5"
                    >
                      <rect x="3" y="3" width="7" height="7" rx="1" />
                      <rect x="14" y="3" width="7" height="7" rx="1" />
                      <rect x="3" y="14" width="7" height="7" rx="1" />
                      <rect x="14" y="14" width="7" height="7" rx="1" />
                    </svg>
                  </span>
                  <span class="min-w-0 flex-1">
                    <span class="block text-sm font-semibold text-gray-900">
                      Dashboard
                    </span>
                    <span class="block text-xs text-gray-500">
                      Manage your tournaments
                    </span>
                  </span>
                  <span
                    class="text-lg text-gray-300 transition group-hover:translate-x-0.5 group-hover:text-gray-500"
                    aria-hidden="true"
                  >
                    ›
                  </span>
                </button>
              </div>

              <div class="border-t border-gray-100 p-2">
                <button
                  type="button"
                  role="menuitem"
                  class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-red-600 transition hover:bg-red-50 focus-visible:bg-red-50 focus-visible:outline-none"
                  (click)="signOut()"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    class="size-5"
                    aria-hidden="true"
                  >
                    <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4" />
                    <path d="m15 16 4-4-4-4" />
                    <path d="M19 12H9" />
                  </svg>
                  Sign out
                </button>
              </div>
            </div>
          }
        </div>
      } @else {
        <game-scheduler-button
          label="Join tournament"
          icon="trophy"
          (click)="loginClicked.emit()"
        />
      }
    </div>
  </div>
</header>
