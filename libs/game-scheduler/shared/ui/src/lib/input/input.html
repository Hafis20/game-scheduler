<div class="flex flex-col gap-2">
  @if (label()) {
  <label [for]="id()" class="text-sm font-medium">{{ label() }}</label>
  }

  <input
    [id]="id()"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [attr.min]="min() ?? null"
    [attr.max]="max() ?? null"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-invalid]="invalid()"
    (input)="onValueChange($event)"
    (blur)="touch.emit()"
    class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 outline-none transition focus:border-gray-900 disabled:cursor-not-allowed disabled:opacity-50"
    [class.border-red-500]="invalid()"
  />
</div>
