<main class="mx-auto max-w-7xl px-4 pb-16 pt-28 sm:px-6 lg:px-8">
  <header>
    <p class="text-sm font-semibold text-green-700">Dashboard</p>
    <h1 class="mt-1 text-3xl font-semibold text-gray-950">Welcome back</h1>
    <p class="mt-2 text-sm text-gray-500">
      Manage your competitions from one place.
    </p>
  </header>

  <section class="mt-8" aria-labelledby="dashboard-navigation">
    <h2 id="dashboard-navigation" class="sr-only">Dashboard navigation</h2>

    <div class="grid grid-cols-2">
      @for(nav of dashboardNavigation(); track nav.id){
      <a
        [routerLink]="nav.routerLink"
        class="group flex max-w-xl items-center gap-4 rounded-xl border border-gray-200 bg-white p-5 transition hover:border-green-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-green-500 focus-visible:ring-offset-2"
      >
        <span
          class="inline-flex size-12 shrink-0 items-center justify-center rounded-xl bg-green-50 text-green-700"
          aria-hidden="true"
        >
          @switch (nav.icon) { @case ('log-in') {
          <svg lucideLogIn class="size-4" aria-hidden="true"></svg>
          } @case ('trophy') {
          <svg lucideTrophy class="size-4" aria-hidden="true"></svg>

          } }
        </span>

        <span class="min-w-0 flex-1">
          <span class="block text-lg font-semibold text-gray-950">
            {{nav.title}}
          </span>
          <span class="mt-1 block text-sm text-gray-500">
            Create tournaments and view your competition list.
          </span>
        </span>

        <span
          class="text-2xl text-gray-300 transition group-hover:translate-x-1 group-hover:text-green-600"
          aria-hidden="true"
        >
          →
        </span>
      </a>
      }
    </div>
  </section>
</main>
