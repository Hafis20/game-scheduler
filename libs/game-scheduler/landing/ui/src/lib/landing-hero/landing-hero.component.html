<section
  class="relative flex min-h-[calc(100vh-80px)] overflow-hidden border-b border-gray-200 bg-linear-to-b from-white via-[#f7fff4] to-gray-100"
>
  <span
    class="pointer-events-none absolute inset-0 bg-[linear-gradient(#2f7d320e_1px,transparent_1px),linear-gradient(90deg,#2f7d320e_1px,transparent_1px)] bg-[size:40px_40px]"
    aria-hidden="true"
  ></span>
  <div
    class="relative z-10 mx-auto flex min-h-[calc(100svh-8rem)] max-w-7xl flex-col items-center justify-center px-4 py-16 text-center sm:px-6 lg:min-h-[680px] lg:px-8"
  >
    <div
      class="inline-flex items-center gap-3 rounded-full border border-slate-300 bg-white px-3 py-2 text-xs font-bold uppercase text-gray-700"
    >
      <span class="size-2 rounded-full bg-primary"></span>
      Game Scheduler
      <span class="text-gray-400">Live tournaments</span>
    </div>

    <p class="mt-8 text-xs font-semibold uppercase text-gray-500">
      The match night control system
    </p>

    <h1
      class="font-rubik mt-4 max-w-5xl text-5xl font-normal uppercase leading-none bg-linear-to-r from-green-700 to-violet-700 bg-clip-text sm:text-6xl lg:text-8xl text-transparent"
    >
      {{ title() }}
    </h1>

    <p class="mt-6 max-w-2xl text-base leading-7 text-gray-600 sm:text-lg">
      Plan every match, tournament, squad, and score from one clean board
      without the group-chat chaos.
    </p>

    <p
      class="mt-4 flex max-w-2xl items-center justify-center gap-2 text-center text-xs font-semibold uppercase text-gray-600 sm:text-sm"
    >
      <span
        class="size-2 shrink-0 rounded-full bg-[#56b947]"
        aria-hidden="true"
      ></span>
      <span>{{ venue() }}</span>
    </p>

    <div
      class="mt-8 flex w-full max-w-lg flex-col justify-center gap-3 sm:flex-row"
    >
      <game-scheduler-button
        class="flex-1"
        label="Launch Tournament"
        href="#join"
        icon="trophy"
        size="large"
        [fullWidth]="true"
      />
      <game-scheduler-button
        class="flex-1"
        label="Explore Tournaments"
        href="#arena"
        icon="arrow-right"
        size="large"
        variant="black"
        [fullWidth]="true"
      />
    </div>
  </div>
</section>
