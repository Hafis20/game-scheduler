<section
  class="relative overflow-hidden border-b border-gray-200 bg-linear-to-b from-white via-[#f7fff4] to-gray-100"
>
  <span
    class="pointer-events-none absolute inset-0 bg-[linear-gradient(#2f7d320e_1px,transparent_1px),linear-gradient(90deg,#2f7d320e_1px,transparent_1px)] bg-[size:40px_40px]"
    aria-hidden="true"
  ></span>
  <div
    class="relative z-10 mx-auto flex min-h-[calc(100svh-8rem)] max-w-7xl flex-col items-center justify-center px-4 py-16 text-center sm:px-6 lg:min-h-[680px] lg:px-8"
  >
    <div
      class="inline-flex items-center gap-3 rounded border border-gray-300 bg-white px-3 py-2 text-xs font-bold uppercase text-gray-700 shadow-sm"
    >
      <span class="size-2 rounded-full bg-[#56b947]"></span>
      Game Scheduler
      <span class="text-gray-400">Live rooms</span>
    </div>

    <p class="mt-8 text-xs font-black uppercase text-gray-500">
      The match night control system
    </p>

    <h1
      class="mt-4 max-w-5xl text-5xl font-black uppercase leading-none text-gray-950 sm:text-6xl lg:text-8xl"
    >
      {{ title() }}
    </h1>

    <p class="mt-6 max-w-2xl text-base leading-7 text-gray-600 sm:text-lg">
      Plan every match, room, squad, and score from one clean board without the
      group-chat chaos.
    </p>

    <p
      class="mt-4 flex max-w-2xl items-center justify-center gap-2 text-center text-xs font-black uppercase text-gray-600 sm:text-sm"
    >
      <span
        class="size-2 shrink-0 rounded-full bg-[#56b947]"
        aria-hidden="true"
      ></span>
      <span>{{ venue() }}</span>
    </p>

    <div
      class="mt-8 flex w-full max-w-md flex-col justify-center gap-3 sm:flex-row"
    >
      <a
        class="inline-flex min-h-12 flex-1 items-center justify-center rounded-2xl bg-[#7cff4f] px-6 text-sm font-bold text-gray-950 transition hover:bg-[#69e93c]"
        href="#join"
      >
        Create a match
      </a>
      <a
        class="inline-flex min-h-12 flex-1 items-center justify-center rounded-2xl border border-gray-300 bg-white px-6 text-sm font-bold text-gray-950 transition hover:border-gray-500 hover:bg-gray-50"
        href="#arena"
      >
        Explore rooms
      </a>
    </div>

    <dl
      class="mt-12 grid w-full max-w-2xl grid-cols-3 border-y border-gray-300 py-5"
    >
      <div class="border-r border-gray-300 px-2 text-center">
        <dt class="text-[10px] font-bold uppercase text-gray-500 sm:text-xs">
          Players online
        </dt>
        <dd class="mt-2 text-xl font-black text-gray-950 sm:text-2xl">6</dd>
      </div>
      <div class="border-r border-gray-300 px-2 text-center">
        <dt class="text-[10px] font-bold uppercase text-gray-500 sm:text-xs">
          Open rooms
        </dt>
        <dd class="mt-2 text-xl font-black text-gray-950 sm:text-2xl">1</dd>
      </div>
      <div class="px-2 text-center">
        <dt class="text-[10px] font-bold uppercase text-gray-500 sm:text-xs">
          Schedule status
        </dt>
        <dd class="mt-2 text-xl font-black text-[#337828] sm:text-2xl">
          Ready
        </dd>
      </div>
    </dl>
  </div>
</section>
