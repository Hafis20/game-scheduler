<main class="mx-auto max-w-7xl px-4 pb-16 pt-28 sm:px-6 lg:px-8">
  <header>
    <p class="text-sm font-semibold text-green-700">Tournaments</p>
    <h1 class="mt-1 text-3xl font-semibold text-gray-950">Your tournaments</h1>
    <p class="mt-2 text-sm text-gray-500">
      Create and manage your competitions from one place.
    </p>
  </header>

  @if (inviteLink()) {
  <section
    class="mt-8 rounded-lg border border-green-200 bg-green-50 p-4"
    aria-labelledby="invite-link-heading"
  >
    <h2 id="invite-link-heading" class="font-semibold text-green-950">
      Tournament created
    </h2>
    <p class="mt-1 text-sm text-green-800">Share this link with players.</p>
    <div class="mt-3 flex flex-col gap-2 sm:flex-row">
      <input
        class="min-w-0 flex-1 rounded-lg border border-green-300 bg-white px-3 py-2 text-sm text-gray-900"
        aria-label="Tournament invite link"
        [value]="inviteLink()"
        readonly
      />
      <button
        type="button"
        class="rounded-lg bg-black px-4 py-2 text-sm font-semibold text-white"
        (click)="copyInviteLink()"
      >
        {{ inviteLinkCopied() ? 'Copied' : 'Copy link' }}
      </button>
    </div>
  </section>
  }

  <section class="mt-8" aria-labelledby="tournament-list-heading">
    <h2 id="tournament-list-heading" class="sr-only">Tournament list</h2>

    <lib-tournament-list
      [tournaments]="tournaments()"
      [loading]="isLoadingTournaments()"
      [errorMessage]="loadTournamentsError()"
      (createRequested)="openTournamentCreationPopup()"
      (retryRequested)="loadTournaments()"
      (detailsRequested)="viewTournamentDetails($event)"
    />
  </section>

  @if (isTournamentCreating()) {
  <lib-create-tournament
    [submitting]="isTournamentSubmitting()"
    [errorMessage]="createTournamentError()"
    (closed)="closeTournamentCreationPopup()"
    (created)="onTournamentCreated($event)"
  />
  }
</main>
