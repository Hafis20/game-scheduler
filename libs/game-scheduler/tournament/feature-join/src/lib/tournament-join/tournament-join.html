<main class="mx-auto max-w-7xl px-4 pb-16 pt-28 sm:px-6 lg:px-8">
  <header>
    <p class="text-sm font-semibold text-green-700">Tournaments</p>
    <h1 class="mt-1 text-3xl font-semibold text-gray-950">Join a tournament</h1>
    <p class="mt-2 text-sm text-gray-500">
      Enter the invitation token shared by the tournament organizer.
    </p>
  </header>

  <section class="mt-8 max-w-xl" aria-labelledby="join-token-heading">
    <h2 id="join-token-heading" class="sr-only">Tournament invitation</h2>

    <game-scheduler-input
      [id]="'tournament-token'"
      label="Invitation token"
      placeholder="Enter tournament token"
      [value]="token()"
      (valueChange)="token.set($event)"
    />
  </section>
</main>
