<section class="mx-auto mt-20 max-w-7xl px-10">
  <lib-tournament-list
    [tournaments]="tournaments()"
    [loading]="isLoadingTournaments()"
    [errorMessage]="loadTournamentsError()"
    (createRequested)="openTournamentCreationPopup()"
    (retryRequested)="loadTournaments()"
  />

  @if (isTournamentCreating()) {
  <lib-create-tournament
    [submitting]="isTournamentSubmitting()"
    [errorMessage]="createTournamentError()"
    (closed)="closeTournamentCreationPopup()"
    (created)="onTournamentCreated($event)"
  />
  }
</section>
